# Render Blueprint: New -> Blueprint -> pick this repo -> fill ADMIN_EMAIL / ADMIN_PASSWORD -> Apply.
# Needs a paid instance (Starter) because SQLite + uploads live on a persistent disk.
services:
  - type: web
    name: inkverse
    runtime: node
    plan: starter
    region: singapore            # closest Render region to India
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/config
    disk:
      name: inkverse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Add later in the dashboard (Environment tab) when you go live:
      # PUBLIC_URL, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM, BUSINESS_NAME, BUSINESS_GSTIN

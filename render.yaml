# Render Blueprint: New -> Blueprint -> pick this repo -> fill ADMIN_EMAIL / ADMIN_PASSWORD -> Apply.
#
# FREE DEMO SETUP (default): no persistent disk on the free plan, so the database resets whenever the
# instance restarts or wakes from sleep (after ~15 min idle). Demo content is re-seeded on every boot,
# so the site always looks complete — good for a portfolio/demo, NOT for real users or real payments.
#
# FOR PRODUCTION: change plan to starter, add the disk block below, set DATA_DIR=/var/data,
# UPLOAD_DIR=/var/data/uploads and SEED_DEMO=false.
#   disk:
#     name: inkverse-data
#     mountPath: /var/data
#     sizeGB: 1
services:
  - type: web
    name: inkverse
    runtime: node
    plan: free
    region: singapore            # closest Render region to India
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_EMAIL           # your admin login (replaces the public demo admin password)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
